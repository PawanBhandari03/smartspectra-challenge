<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="380" rx="14" fill="#fbf8f2" stroke="#e2d9ca"/>
  <text x="32" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f1d1a">Validation: three real sessions, Nov 12</text>
  <text x="32" y="68" font-size="13" fill="#847b6f">Pulse gap between the two options in each round (second option minus first). Inside the shaded band = normal wobble.</text>

  <!-- axis: x = 500 + bpm * 20 ; range -12..+12 -> 260..740 -->
  <rect x="380" y="96" width="240" height="214" fill="#e2d9ca" fill-opacity="0.45"/>
  <text x="500" y="112" text-anchor="middle" font-size="11.5" fill="#4b463f">within ±6 bpm: not a verdict</text>

  <g stroke="#e9e1d3"><line x1="260" y1="120" x2="260" y2="310"/><line x1="380" y1="120" x2="380" y2="310"/><line x1="620" y1="120" x2="620" y2="310"/><line x1="740" y1="120" x2="740" y2="310"/></g>
  <line x1="500" y1="96" x2="500" y2="310" stroke="#847b6f" stroke-width="1.2"/>
  <line x1="260" y1="310" x2="740" y2="310" stroke="#cdbfaa"/>
  <g font-size="11" fill="#847b6f" text-anchor="middle"><text x="260.0" y="328">−12</text><text x="320.0" y="328">−9</text><text x="380.0" y="328">−6</text><text x="440.0" y="328">−3</text><text x="500.0" y="328">0</text><text x="560.0" y="328">+3</text><text x="620.0" y="328">+6</text><text x="680.0" y="328">+9</text><text x="740.0" y="328">+12 bpm</text></g>

  <!-- rows -->
  <g font-size="13">
    <!-- control y=150 : +5.0, +3.9 -->
    <text x="32" y="146" fill="#1f1d1a" font-weight="600">Control</text>
    <text x="32" y="164" fill="#847b6f" font-size="12">coffee vs tea</text>
    <line x1="260" y1="155" x2="740" y2="155" stroke="#ebe3d6" stroke-dasharray="2 4"/>
    <circle cx="600.0" cy="155" r="7" fill="#1f1d1a" stroke="#fbf8f2" stroke-width="2"/>
    <circle cx="578.0" cy="155" r="7" fill="#fbf8f2" stroke="#1f1d1a" stroke-width="2"/>
    <text x="764" y="151" fill="#1f1d1a" font-size="12.5" font-weight="600">didn't pick a side ✓</text>
    <text x="764" y="167" fill="#847b6f" font-size="11.5">+5.0 · +3.9</text>

    <!-- real y=215 : -2.3, +9.0 -->
    <text x="32" y="206" fill="#1f1d1a" font-weight="600">Real decision</text>
    <text x="32" y="224" fill="#847b6f" font-size="12">Bangalore vs city</text>
    <line x1="260" y1="215" x2="740" y2="215" stroke="#ebe3d6" stroke-dasharray="2 4"/>
    <circle cx="454.0" cy="215" r="7" fill="#1f1d1a" stroke="#fbf8f2" stroke-width="2"/>
    <circle cx="680.0" cy="215" r="7" fill="#fbf8f2" stroke="#1f1d1a" stroke-width="2"/>
    <text x="764" y="211" fill="#1f1d1a" font-size="12.5" font-weight="600">didn't pick a side</text>
    <text x="764" y="227" fill="#847b6f" font-size="11.5">−2.3 · +9.0 (disagree)</text>

    <!-- positive y=275 : +10.0, +8.1 -->
    <text x="32" y="266" fill="#1f1d1a" font-weight="600">Positive control</text>
    <text x="32" y="284" fill="#847b6f" font-size="12">speech vs beach</text>
    <line x1="260" y1="275" x2="740" y2="275" stroke="#ebe3d6" stroke-dasharray="2 4"/>
    <circle cx="700.0" cy="275" r="7" fill="#1f1d1a" stroke="#fbf8f2" stroke-width="2"/>
    <circle cx="662.0" cy="275" r="7" fill="#fbf8f2" stroke="#1f1d1a" stroke-width="2"/>
    <text x="764" y="271" fill="#2f5d46" font-size="12.5" font-weight="600">calmer with the beach ✓</text>
    <text x="764" y="287" fill="#847b6f" font-size="11.5">+10.0 · +8.1</text>
  </g>

  <!-- legend -->
  <circle cx="40" cy="356" r="6" fill="#1f1d1a"/>
  <text x="52" y="360" font-size="12" fill="#4b463f">round 1</text>
  <circle cx="122" cy="356" r="6" fill="#fbf8f2" stroke="#1f1d1a" stroke-width="2"/>
  <text x="134" y="360" font-size="12" fill="#4b463f">round 2</text>
  <text x="212" y="360" font-size="12" fill="#847b6f">Daylight, phone camera, 30 fps · per-visit medians of reliable readings · same rule for all three sessions</text>
</svg>
