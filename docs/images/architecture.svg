<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4b463f"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#847b6f"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="14" fill="#fbf8f2" stroke="#e2d9ca"/>
  <text x="32" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f1d1a">How CrossRoads is put together</text>
  <text x="32" y="68" font-size="13" fill="#847b6f">Electron desktop app · video stays in the main process · only numbers are saved</text>

  <!-- Presage cloud -->
  <rect x="330" y="92" width="300" height="56" rx="10" fill="none" stroke="#847b6f" stroke-dasharray="5 4"/>
  <text x="480" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#4b463f">Presage servers</text>
  <text x="480" y="134" text-anchor="middle" font-size="12" fill="#847b6f">API key &amp; credit check · telemetry switched off</text>

  <!-- Camera -->
  <rect x="32" y="240" width="150" height="110" rx="10" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="107" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1d1a">Camera</text>
  <text x="107" y="302" text-anchor="middle" font-size="12" fill="#4b463f">webcam or phone</text>
  <text x="107" y="319" text-anchor="middle" font-size="12" fill="#4b463f">(Phone Link)</text>

  <!-- Main process -->
  <rect x="226" y="178" width="300" height="300" rx="12" fill="#ffffff" stroke="#1f1d1a" stroke-width="1.5"/>
  <text x="246" y="206" font-size="15" font-weight="700" fill="#1f1d1a">Main process (Node.js)</text>
  <text x="246" y="224" font-size="12" fill="#847b6f">src/main/main.js</text>

  <rect x="246" y="240" width="260" height="62" rx="8" fill="#e5ece5" stroke="#2f5d46"/>
  <text x="258" y="262" font-size="13" font-weight="600" fill="#1f1d1a">SmartSpectra SDK 3.5 (native)</text>
  <text x="258" y="280" font-size="12" fill="#4b463f">useCamera · 1280×720 @ 30 fps</text>
  <text x="258" y="295" font-size="12" fill="#4b463f">pulse · breathing · HRV · blinks · expressions</text>

  <rect x="246" y="312" width="260" height="40" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="258" y="337" font-size="12" fill="#4b463f">Preview thumbnailer · 320 px · 10 fps</text>

  <rect x="246" y="362" width="260" height="40" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="258" y="387" font-size="12" fill="#4b463f">Sessions + recordings (JSON, local disk)</text>

  <rect x="246" y="412" width="260" height="46" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="258" y="432" font-size="12" fill="#4b463f">API key: .env (dev) or encrypted with</text>
  <text x="258" y="448" font-size="12" fill="#4b463f">Windows safeStorage (installed app)</text>

  <!-- Bridge -->
  <rect x="560" y="268" width="96" height="120" rx="10" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="608" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">Preload</text>
  <text x="608" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">bridge</text>
  <text x="608" y="342" text-anchor="middle" font-size="11" fill="#847b6f">context-</text>
  <text x="608" y="356" text-anchor="middle" font-size="11" fill="#847b6f">isolated IPC</text>

  <!-- Renderer -->
  <rect x="690" y="178" width="238" height="300" rx="12" fill="#ffffff" stroke="#1f1d1a" stroke-width="1.5"/>
  <text x="708" y="206" font-size="15" font-weight="700" fill="#1f1d1a">Renderer (sandboxed)</text>
  <text x="708" y="224" font-size="12" fill="#847b6f">src/renderer · src/core</text>

  <rect x="708" y="240" width="202" height="62" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="720" y="262" font-size="13" font-weight="600" fill="#1f1d1a">Session runner</text>
  <text x="720" y="280" font-size="12" fill="#4b463f">A B B A visits · prompts ·</text>
  <text x="720" y="295" font-size="12" fill="#4b463f">settle gate · time limits</text>

  <rect x="708" y="312" width="202" height="62" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="720" y="334" font-size="13" font-weight="600" fill="#1f1d1a">Analysis</text>
  <text x="720" y="352" font-size="12" fill="#4b463f">filters · per-visit medians ·</text>
  <text x="720" y="367" font-size="12" fill="#4b463f">verdict · moments</text>

  <rect x="708" y="384" width="202" height="74" rx="8" fill="#f1ebe0" stroke="#cdbfaa"/>
  <text x="720" y="406" font-size="13" font-weight="600" fill="#1f1d1a">Screens</text>
  <text x="720" y="424" font-size="12" fill="#4b463f">session · results mirror ·</text>
  <text x="720" y="440" font-size="12" fill="#4b463f">journal · settings · sample</text>

  <!-- Arrows -->
  <line x1="182" y1="295" x2="244" y2="280" stroke="#4b463f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="190" y="270" font-size="11" fill="#847b6f">frames</text>

  <line x1="400" y1="240" x2="440" y2="150" stroke="#847b6f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowMuted)" marker-start="url(#arrowMuted)"/>

  <line x1="526" y1="300" x2="558" y2="300" stroke="#4b463f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="656" y1="300" x2="688" y2="300" stroke="#4b463f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="688" y1="356" x2="658" y2="356" stroke="#4b463f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="558" y1="356" x2="528" y2="356" stroke="#4b463f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="608" y="246" text-anchor="middle" font-size="11" fill="#847b6f">numbers, status,</text>
  <text x="608" y="260" text-anchor="middle" font-size="11" fill="#847b6f">preview pixels →</text>
  <text x="608" y="406" text-anchor="middle" font-size="11" fill="#847b6f">← start · stop · save</text>

  <text x="32" y="520" font-size="12.5" fill="#4b463f">Video is captured and analysed by the SDK inside the main process. The window only receives numbers and a small</text>
  <text x="32" y="539" font-size="12.5" fill="#4b463f">preview thumbnail; nothing but option text, timings and numbers is written to disk.</text>
</svg>
